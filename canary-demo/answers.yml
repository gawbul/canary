# Additional Observations
observations:
  unexpected_behaviors: # 1) prometheus wasn't scraping the service monitor /metrics endpoint for the canary-demo namespace.
                        # running the following command returned `prometheus`
                        # kubectl get prometheuses.monitoring.coreos.com --all-namespaces -o jsonpath="{.items[*].spec.serviceMonitorSelector}"
                        # i needed to do a `kubectl edit -n canary-demo prometheuses.monitoring.coreos.com` and then find the 
                        # serviceMonitorSelector value and change it to `serviceMonitorSelector: {}` in order to get prometheus to scrape
                        # the correct endpoints.
                        # 2) running the PromQL query `rate(http_requests_total{version="v1"}[5m])` returns 3 values, 1 for each pod
                        # i amended the query to get the average of the requests for all pods to answer the question.
  suggested_improvements: # if you try the example helm commands listed you will inadvertantly uninstall your helm deployment
                          # and need to reinstall it again to get the answers to the above questions.
                          # it might be prudent to give a warning about this if people aren't familiar with helm as the subsequent
                          # commands will fail after uninstalling.